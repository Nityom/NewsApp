name: Delete expired articles

on:
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report expired articles without deleting them
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: article-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scripts/article-cleanup
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/article-cleanup/package-lock.json

      - name: Install cleanup dependencies
        run: npm ci

      - name: Run cleanup
        run: |
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            npm run dry-run
          else
            npm run cleanup
          fi
